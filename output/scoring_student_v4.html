<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>채점 - 김하나 | AI 서·논술형 평가지원시스템</title>
  <link rel="icon" href="../screens/favicon_src.png?v=2" type="image/png">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    @import url('../screens/fonts.css');
    * { font-family: 'NanumSquareRound', sans-serif; box-sizing: border-box; }
    body { margin: 0; padding: 0; background: white; overflow: hidden; }
    button { font-family: inherit; }

    .main-content { display: flex; height: calc(100vh - 68px); overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D9D9D9; border-radius: 3px; }

    /* 공통 버튼 (중앙정렬 5종) */
    .btn-c { display: inline-flex; align-items: center; justify-content: center; line-height: 1; vertical-align: middle; }

    .score-btn {
      width: 28px; height: 28px; border-radius: 6px; font-size: 18px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center; line-height: 1; vertical-align: middle;
      cursor: pointer; border: 1px solid #0950A0; color: #0950A0; background: white; transition: all .15s;
    }
    .score-btn.selected { background: #0950A0; color: white; }
    .score-btn.ai { background: #E7F2FF; } /* AI 제안 점수 (선생님 미확정) */

    .pill-btn {
      background: white; border: 1px solid #999; border-radius: 9999px; height: 32px; padding: 0 16px;
      font-size: 14px; font-weight: 700; color: #494949; cursor: pointer; gap: 4px;
      display: inline-flex; align-items: center; justify-content: center; line-height: 1; vertical-align: middle;
    }
    .pill-btn:hover { background: #F5F5F5; }
    .text-btn { background: none; border: none; height: 32px; padding: 0 8px; border-radius: 6px; font-size: 14px; font-weight: 700; color: #808080; cursor: pointer; gap: 4px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; vertical-align: middle; }
    .text-btn:hover { background: #F0F0F0; color: #494949; }
    .grey-btn { background: white; border: 1px solid #D9D9D9; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 700; color: #494949; cursor: pointer; gap: 4px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; vertical-align: middle; }
    .grey-btn:hover { background: #F5F5F5; border-color: #B3B3B3; }
    /* 버튼 무게: 파란 채움=저장 / 연한 파랑 테두리=AI 채점 재실행(찾을 수 있게) / 회색 테두리=AI 제안 점수 적용(편의, 강조 X — AI 실수 가능) / 회색 글자=점수 초기화(가장 드묾) */
    .ai-outline-btn { background: white; border: 1px solid #7FB3E8; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 700; color: #0950A0; cursor: pointer; gap: 4px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; vertical-align: middle; }
    .ai-outline-btn:hover { background: #F3F9FF; }
    .primary-btn {
      background: #0950A0; border: none; border-radius: 8px; height: 40px; padding: 0 16px;
      font-size: 16px; font-weight: 700; color: white; cursor: pointer; gap: 6px;
      display: inline-flex; align-items: center; justify-content: center; line-height: 1; vertical-align: middle;
    }
    .primary-btn:hover { background: #0A4A94; }
    .outline-btn {
      background: white; border: 1px solid #0950A0; border-radius: 8px; height: 40px; padding: 0 16px;
      font-size: 16px; font-weight: 700; color: #0950A0; cursor: pointer; gap: 6px;
      display: inline-flex; align-items: center; justify-content: center; line-height: 1; vertical-align: middle;
    }
    .outline-btn:hover { background: #F3F9FF; }

    .radio-item { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 16px; font-weight: 700; color: #333; }
    .radio-circle { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #D9D9D9; flex-shrink: 0; }
    .radio-circle.selected { border: 5px solid #0950A0; }

    /* 우측 탭 (채점 | 피드백) — 활성은 색·밑줄만, 굵기 변화 없음 */
    /* 탭 줄: 회색 바탕 + 선택 탭만 흰 바탕·파란 밑줄 (겹침·둥근 모서리 없이 반듯하게) */
    .r-tabbar { display: flex; flex-shrink: 0; background: #F0F0F0; border-bottom: 1px solid #D9D9D9; }
    .r-tab {
      flex: 1; height: 52px; border: none; border-bottom: 3px solid transparent; background: transparent; cursor: pointer;
      font-size: 16px; font-weight: 700; color: #808080; position: relative; gap: 6px; padding-top: 3px;
      display: inline-flex; align-items: center; justify-content: center; line-height: 1; vertical-align: middle;
    }
    .r-tab + .r-tab { border-left: 1px solid #D9D9D9; }
    .r-tab:hover { color: #494949; background: #E8E8E8; }
    .r-tab.active { color: #0950A0; background: white; border-bottom-color: #0950A0; }
    /* 입력하면 ✓ (채점=점수 모두 고름 / 피드백=선생님 직접 피드백 작성). 미완료 표시는 두지 않음 */
    .r-tab .tab-check { display: none; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #00AF3D; color: white; }
    .r-tab .tab-check.on { display: inline-flex; }

    /* 세그먼트 스위치 (근거 보기 / AI 모델) */
    .seg { display: inline-flex; background: #F0F0F0; border-radius: 8px; padding: 3px; gap: 2px; }
    .seg button {
      height: 30px; padding: 0 12px; border: none; border-radius: 6px; background: transparent;
      font-size: 14px; font-weight: 700; color: #6D7381; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; line-height: 1; vertical-align: middle;
    }
    .seg button.active { background: white; color: #0950A0; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .seg button { gap: 4px; position: relative; }
    .seg-label { width: 44px; flex-shrink: 0; font-size: 14px; font-weight: 700; color: #494949; } /* 두 탭 세그먼트 시작점 맞춤 */
    .seg button .beta-badge { height: 18px; padding: 0 6px; font-size: 11px; }
    .seg button.disabled { cursor: not-allowed; color: #B3B3B3; }
    .seg button.disabled .beta-badge { background: #EDEDED; color: #9A9A9A; }
    .seg button[data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); background: #fff; color: #0A2A5E; font-size: 14px; font-weight: 700; line-height: 18px; padding: 10px 16px; border-radius: 8px; white-space: nowrap; z-index: 20; box-shadow: 0 4px 36px rgba(45,85,145,.16); }

    .tab-toggle-btn {
      flex: 1; height: 40px; font-size: 16px; font-weight: 700; cursor: pointer; border-radius: 8px;
      border: none; color: #494949; background: transparent; transition: all .15s;
      display: flex; align-items: center; justify-content: center; line-height: 1;
    }
    .tab-toggle-btn.active { background: white; color: #0950A0; box-shadow: 0 1px 4px rgba(0,0,0,.08); }


    /* 피드백 단위 선택 — 시안 A(카드) / B(풀폭 탭) / C(채운 세그먼트) */
    .unit-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .unit-card { border: 1px solid #D9D9D9; border-radius: 10px; background: white; padding: 12px 12px 12px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 6px; }
    .unit-card:hover { border-color: #7FB3E8; }
    .unit-card .uc-name { font-size: 16px; font-weight: 700; color: #333; display: flex; align-items: center; gap: 6px; line-height: 1.2; }
    .unit-card .uc-desc { font-size: 14px; color: #808080; line-height: 1.4; }
    .unit-card.active { border-color: #7FB3E8; background: #F3F9FF; }
    .unit-card.active .uc-name { color: #0950A0; }
    .beta-badge { display: inline-flex; align-items: center; justify-content: center; line-height: 1; vertical-align: middle; height: 20px; padding: 0 7px; border-radius: 6px; background: #E7F2FF; color: #0950A0; font-size: 12px; font-weight: 700; letter-spacing: .2px; flex-shrink: 0; margin-left: 2px; }
    .unit-card.disabled { cursor: not-allowed; background: #F8F8F8; border-color: #E5E5E5; position: relative; }
    .unit-card.disabled .uc-name { color: #B3B3B3; }
    .unit-card.disabled .beta-badge { background: #EDEDED; color: #9A9A9A; }
    .unit-card.disabled:hover { border-color: #E5E5E5; }
    .unit-card[data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); background: #fff; color: #0A2A5E; font-size: 14px; font-weight: 700; line-height: 18px; padding: 10px 16px; border-radius: 8px; white-space: nowrap; z-index: 20; box-shadow: 0 4px 36px rgba(45,85,145,.16); }
    .unit-tabs { display: flex; border-bottom: 1px solid #D9D9D9; }
    .unit-tabs button { flex: 1; height: 44px; border: none; background: none; font-size: 16px; font-weight: 700; color: #808080; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; gap: 6px; }
    .unit-tabs button.active { color: #0950A0; border-bottom-color: #0950A0; }
    .unit-fill { display: flex; border: 1px solid #0950A0; border-radius: 8px; overflow: hidden; }
    .unit-fill button { flex: 1; height: 40px; border: none; background: white; font-size: 16px; font-weight: 700; color: #0950A0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; line-height: 1; gap: 6px; }
    .unit-fill button + button { border-left: 1px solid #0950A0; }
    .unit-fill button.active { background: #0950A0; color: white; }

    /* 단위 카드는 이름만 — 가운데 정렬 */
    #fb-views .unit-card, #reason-switch .unit-card { align-items: center; justify-content: center; line-height: 1; }

    /* 근거 블록 */
    .reason { font-size: 16px; color: #333; line-height: 1.6; margin: 12px 0 0; background: #F8F8F8; border-radius: 12px; padding: 16px 20px; }
    .reason-label { display: block; font-size: 14px; font-weight: 700; color: #6D7381; margin-bottom: 4px; }
    .q-chip { display: inline-flex; align-items: center; background: #E7F2FF; color: #0950A0; border-radius: 100px; padding: 3px 10px; font-size: 14px; font-weight: 700; line-height: 1.2; flex-shrink: 0; }
    .q-title { font-size: 16px; font-weight: 700; color: #333; line-height: 1.5; }
    .q-chip { margin-top: 1px; }
    /* 정오 판정 칩 (정답형 문항만) — 줄 오른쪽 끝 고정 */
    .judge-chip { flex-shrink: 0; margin-top: 1px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; height: 24px; padding: 0 10px; border-radius: 100px; font-size: 14px; font-weight: 700; }
    .judge-ok { background: #E6F7EC; color: #00873A; }
    .judge-part { background: #FFF3E6; color: #C25E00; }
    .judge-no { background: #FFEFEF; color: #DB3E51; }
    .judge-open { background: #F0F0F0; color: #6D7381; }
    .score-tag { margin-left: auto; flex-shrink: 0; font-size: 14px; font-weight: 700; color: #808080; line-height: 1.5; }
    .score-tag.diff { color: #C25E00; background: #FFF3E6; border-radius: 100px; padding: 2px 10px; }
    .pair-row + .pair-row { margin-top: 12px; }
    .pair-label { display: block; font-size: 14px; font-weight: 700; color: #6D7381; margin-bottom: 4px; }
    .rel-line { font-size: 14px; color: #808080; line-height: 1.5; margin: 8px 0 0 4px; }
    .rel-src { margin-left: 6px; color: #9A9A9A; font-weight: 700; }
    .rel-src::before { content: '·'; margin-right: 6px; font-weight: 400; }

    /* 피드백 블록 */
    .fb-block + .fb-block { border-top: 1px solid #EDEDED; padding-top: 16px; margin-top: 16px; }
    .fb-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .fb-text { font-size: 16px; color: #333; line-height: 1.6; white-space: pre-wrap; margin: 0; }

    /* 좌측 탭 */
    .l-switch { display: inline-flex; gap: 4px; background: #EBEBEB; padding: 4px; border-radius: 10px; }
    .l-tab { height: 34px; padding: 0 16px; border-radius: 7px; border: none; cursor: pointer; font-size: 14px; font-weight: 700; color: #808080; background: transparent; gap: 6px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
    .l-tab.active { background: #0950A0; color: white; }
  </style>
</head>
<body>

<!-- 상단 타이틀바 -->
<div style="position:sticky;top:0;z-index:50;height:68px;display:flex;align-items:stretch;background:#F8F8F8;border-top:1px solid #D9D9D9;border-bottom:1px solid #D9D9D9;">
  <button onclick="showToast('info','목록으로 이동해요.')" style="width:68px;height:68px;background:#0950A0;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0;padding:0;">
    <i data-lucide="arrow-left" style="width:28px;height:28px;color:white;"></i>
    <span style="font-size:14px;font-weight:700;color:white;line-height:1;">목록으로</span>
  </button>
  <div style="flex:1;display:flex;align-items:center;justify-content:space-between;padding:0 24px;">
    <div style="display:flex;align-items:center;gap:16px;">
      <div style="background:white;border:1px solid #D4D3D1;border-radius:6px;padding:8px 12px 8px 16px;min-width:345px;display:flex;align-items:center;justify-content:space-between;">
        <span id="student-name" style="font-size:18px;font-weight:700;color:#333;line-height:1.25;">10101 김하나 (채점 진행)</span>
        <i data-lucide="chevron-down" style="width:24px;height:24px;color:#333;"></i>
      </div>
      <div style="display:inline-flex;align-items:center;gap:6px;">
        <i data-lucide="check" style="width:16px;height:16px;color:#00AF3D;"></i>
        <span style="font-size:16px;font-weight:700;color:#494949;line-height:1;">21명 중 4명 채점 완료</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn-c" style="background:none;border:none;font-size:16px;font-weight:700;color:#494949;cursor:pointer;padding:0;gap:4px;"><i data-lucide="chevron-left" style="width:20px;height:20px;"></i>이전 학생</button>
        <div style="width:1px;height:13px;background:#D9D9D9;"></div>
        <button class="btn-c" style="background:none;border:none;font-size:16px;font-weight:700;color:#494949;cursor:pointer;padding:0;gap:4px;">다음 학생<i data-lucide="chevron-right" style="width:20px;height:20px;"></i></button>
      </div>
      <button class="primary-btn" onclick="saveNow(false)"><i data-lucide="check" style="width:20px;height:20px;"></i>저장</button>
    </div>
  </div>
</div>

<div class="main-content">

  <!-- ===== 좌측: 답안 뷰어 ===== -->
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;gap:12px;background:#FAFAFA;border-bottom:1px solid #E5E5E5;padding:10px 20px;flex-shrink:0;">
      <div class="l-switch">
        <button class="l-tab active" id="l-tab-orig" onclick="switchLeft('orig')"><i data-lucide="file-image" style="width:14px;height:14px;"></i>원본 제출물</button>
        <button class="l-tab" id="l-tab-text" onclick="switchLeft('text')"><i data-lucide="align-left" style="width:14px;height:14px;"></i>인식 결과</button>
      </div>
    </div>
    <div id="l-orig" style="flex:1;display:flex;flex-direction:column;min-height:0;">
      <div style="background:#494949;display:flex;align-items:center;justify-content:center;gap:24px;padding:4px 20px;min-height:44px;flex-shrink:0;color:white;font-size:16px;">
        <span>03/21 14:00 업로드</span>
        <span style="display:inline-flex;align-items:center;gap:10px;"><i data-lucide="chevron-left" style="width:18px;height:18px;"></i><span style="background:#333;border-radius:4px;padding:2px 12px;">1</span>/ 1<i data-lucide="chevron-right" style="width:18px;height:18px;"></i></span>
        <span style="display:inline-flex;align-items:center;gap:8px;"><i data-lucide="zoom-in" style="width:18px;height:18px;"></i>100%<i data-lucide="zoom-out" style="width:18px;height:18px;"></i></span>
      </div>
      <div style="flex:1;overflow:auto;background:#EBEBEA;padding:24px;">
        <img src="../screens/math_triangle_answer.png" style="width:100%;max-width:640px;height:auto;display:block;margin:0 auto;" alt="학생 원본 제출물">
      </div>
    </div>
    <div id="l-text" style="flex:1;display:none;overflow-y:auto;padding:24px;background:#F0F0F0;">
      <div id="l-text-body" style="display:flex;flex-direction:column;gap:28px;background:white;border-radius:12px;padding:32px 36px;"></div>
    </div>
  </div>

  <!-- ===== 우측: 채점 패널 ===== -->
  <div style="width:612px;flex-shrink:0;display:flex;flex-direction:column;background:white;border-left:1px solid #D9D9D9;">

    <!-- 총점·채점 상태 (탭 위 고정) -->
    <div style="padding:20px 24px;border-bottom:1px solid #D9D9D9;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0;">
      <div style="display:flex;align-items:baseline;gap:4px;">
        <span style="font-size:16px;font-weight:700;color:#333;">총점</span>
        <span id="total" style="font-size:18px;font-weight:700;color:#333;">35 / 45</span>
        <span style="font-size:16px;font-weight:700;color:#333;">점</span>
      </div>
      <div style="display:flex;gap:20px;align-items:center;">
        <label class="radio-item" onclick="pickStatus(this)"><div class="radio-circle selected"></div>채점 진행</label>
        <label class="radio-item" onclick="pickStatus(this)"><div class="radio-circle"></div>미제출</label>
        <label class="radio-item" onclick="pickStatus(this)"><div class="radio-circle"></div>미응시</label>
      </div>
    </div>

    <!-- 탭: 채점 | 피드백 -->
    <div class="r-tabbar">
      <button class="r-tab active" id="r-tab-score" onclick="switchTab('score')"><i data-lucide="circle-check-big" style="width:18px;height:18px;"></i>채점<span class="tab-check" id="score-check"><i data-lucide="check" style="width:16px;height:16px;"></i></span></button>
      <button class="r-tab" id="r-tab-fb" onclick="switchTab('fb')"><i data-lucide="message-circle" style="width:18px;height:18px;"></i>피드백<span class="tab-check" id="fb-check"><i data-lucide="check" style="width:16px;height:16px;"></i></span></button>
    </div>

    <div id="r-scroll" style="flex:1;overflow-y:auto;">

      <!-- ─── 채점 탭 ─── -->
      <div id="pane-score" style="padding:24px 24px 52px;">
        <!-- 제목 줄: 드문 행동(재실행·초기화)은 제목 오른쪽 작은 텍스트 버튼 — 숨기지 않되 목록 위를 차지하지 않게 -->
        <div style="display:flex;align-items:center;gap:8px;height:32px;margin-bottom:16px;">
          <i data-lucide="circle-check-big" style="width:20px;height:20px;color:#0950A0;"></i>
          <span style="font-size:18px;font-weight:700;color:#333;">채점 결과</span>
          <!-- 점수 칸 도구 (한 묶음·같은 위계): 점수 초기화 + AI 제안 점수 모두 적용 — 둘 다 회색 글자 -->
          <div style="margin-left:auto;display:flex;align-items:center;gap:4px;">
            <button class="text-btn" onclick="resetScores()"><i data-lucide="eraser" style="width:14px;height:14px;"></i>점수 초기화</button>
            <button id="btn-applyai" class="text-btn" style="margin-right:-8px;" onclick="applyAi()"><i data-lucide="check-check" style="width:14px;height:14px;"></i>AI 제안 점수 모두 적용</button>
          </div>
        </div>

        <!-- 목록 머리: 근거 보기 전환만 (한 번 정하면 끝 → 작은 세그먼트) -->
        <div id="list-head" style="display:flex;align-items:center;gap:10px;">
          <span class="seg-label">근거</span>
          <div class="seg" id="reason-switch">

<div id="toast" style="display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:9999;min-width:320px;padding:16px 24px;border-radius:8px;box-shadow:0 0 1px #494949,0 8px 32px rgba(45,85,145,.16);align-items:center;gap:12px;font-size:16px;font-weight:700;color:white;"></div>

<script>
  // ── 데이터: 중2 수학 「삼각형의 성질에 관한 문제 해결하기」 (에크연 박람회 공개 샘플 · 학생2 답안)
  //    지시문 3개 = 문항 3개. 채점요소는 설계상 문항과 1:1 (요소1=2번, 요소2=3번, 요소3=1번)
  //    type: 'definite'(정답형, correctness 있음) / 'open'(서논술형, correctness 없음) — AI 출력 필드 type·correctness에 대응
  var ELEMENTS = [
    { name:'외심의 성질을 이용한 각의 크기 추론', scores:[3,2,1,0], ai:3,
      reason:'외심에서 세 꼭짓점까지의 거리가 같아 △OAB, △OCA가 이등변삼각형임을 이용하고, 2(63°+x)=180°로 식을 세워 x=27°를 정확히 구함. 각의 관계를 단계적으로 밝힘.',
      feedback:'외심에서 꼭짓점까지의 거리가 같다는 성질로 이등변삼각형을 찾아낸 점이 좋아요. 식을 세우고 답까지 정확하게 구했어요.' },
    { name:'삼각형 넓이와 반지름을 이용한 둘레 구하기', scores:[3,2,1,0], ai:3,
      reason:'내접원의 반지름이 세 변에 내린 높이임을 이용해 ½×5×(a+b+c)=100으로 관계를 세우고, a+b+c=40을 구해 둘레 40cm로 답함. 계산 과정이 논리적이고 정확함.',
      feedback:'내접원의 반지름을 높이로 보고 넓이와 둘레의 관계를 바로 세웠어요. 풀이가 짧고 정확해요.' },
    { name:'이등변삼각형 합동 설정 및 조건 활용', scores:[3,2,1,0], ai:2,
      reason:'AB=AC, ∠DAB=∠DAC, AD 공통 등 합동에 필요한 세 조건을 모두 제시함. 그러나 두 삼각형이 합동이라는 결론과 합동 조건(SAS)을 쓰지 않아 증명이 완결되지 않음.',
      feedback:'합동에 필요한 조건 세 가지를 빠짐없이 찾았어요. 마지막에 "△ABD≡△ACD (SAS 합동)"처럼 결론과 합동 조건을 써 주면 증명이 완성돼요.' }
  ];
  var QUESTIONS = [
    { title:'이등변삼각형의 두 밑각의 크기가 같음을 증명하는 과정의 나머지 부분을 채워 증명하시오.', type:'open', correctness:null,
      answer:'AB=AC\n∠DAB=∠DAC\nAD는 공통',
      reason:'합동 조건에 필요한 AB=AC, ∠DAB=∠DAC, AD 공통을 모두 제시함. 다만 △ABD≡△ACD라는 결론과 합동 조건(SAS)을 밝히지 않아 증명의 마지막 단계가 빠져 있음.',
      feedback:'합동에 필요한 조건 세 가지를 모두 찾았어요. "따라서 △ABD≡△ACD (SAS 합동)"을 덧붙이면 증명이 완성돼요.' },
    { title:'△ABC의 외심 O가 BC 위에 있고 ∠B=63°일 때, 각 x의 크기를 구하시오.', type:'definite', correctness:'correct',
      answer:'외심에서 각 꼭짓점을 이은 선분의 길이는 같으므로 AO=BO=CO 이므로 이등변 삼각형이다. 그리고 두 밑각의 크기가 같아 ∠A=63, ∠C=x 라서 식은 2(63+x)=180, x=27\n답: 27°',
      reason:'AO=BO=CO로 두 이등변삼각형을 찾고, 삼각형 내각의 합을 이용해 2(63°+x)=180°에서 x=27°를 구함. 정답과 일치함.',
      feedback:'외심의 성질로 이등변삼각형을 찾고 내각의 합으로 식을 세운 흐름이 정확해요.' },
    { title:'△ABC에서 내접원 I의 반지름의 길이는 5cm이고 넓이는 100cm²일 때, △ABC의 둘레의 길이를 구하시오.', type:'definite', correctness:'correct',
      answer:'AC=a, AB=b, BC=c 로 놓자. 내접원의 반지름은 높이이므로 ½×(a+b+c)×5=100, 5/2(a+b+c)=100, a+b+c=40\n따라서 △ABC의 둘레의 길이는 40cm이다.\n답: 40cm',
      reason:'내접원의 반지름을 세 삼각형의 높이로 보고 ½×(a+b+c)×5=100을 세워 둘레 40cm를 구함. 정답과 일치함.',
      feedback:'넓이와 둘레의 관계를 한 줄로 세워 깔끔하게 풀었어요.' }
  ];
  var SUMMARY = '삼각형의 외심과 내심의 성질을 이용해 각의 크기와 둘레를 정확하게 구했어요. 증명 문항은 조건을 모두 찾았지만 결론을 쓰지 않았어요.\n\n[잘한 점]\n- 외심·내접원의 성질을 식으로 옮겨 계산 문항 두 개를 모두 정확하게 풂.\n\n[보완할 점]\n- 증명은 조건을 나열한 뒤 "따라서 두 삼각형은 합동(SAS)"처럼 결론과 근거가 되는 합동 조건까지 써야 완성됨.';

  // ── 판정 예시 케이스 (?case=mixed): 실제 답안에는 부분 정답·오답이 없어서, 문항 2·3만 가상 답안으로 바꿔 칩 3종을 보여준다 ──
  // 관련 채점요소 — 실제 답안: 설계상 1:1 (지금은 시스템이 모르므로 AI 추론으로 표시)
  QUESTIONS[0].rel = [2]; QUESTIONS[0].relSrc = 'ai';
  QUESTIONS[1].rel = [0]; QUESTIONS[1].relSrc = 'ai';
  QUESTIONS[2].rel = [1]; QUESTIONS[2].relSrc = 'ai';
  var CASE_KEY = new URLSearchParams(location.search).get('case') || 'real';
  if (CASE_KEY === 'mixed') {
    // 판정 예시에서는 연결 모양도 섞어서 보여줌: 1개 / 2개 / 전부
    QUESTIONS[1].rel = [0, 1];
    QUESTIONS[2].rel = [0, 1, 2];
    QUESTIONS[1].correctness = 'partially_correct';
    QUESTIONS[1].answer = '외심에서 각 꼭짓점까지의 거리는 같으므로 AO=BO=CO. 두 이등변삼각형에서 2(63+x)=180, 126+2x=180, 2x=54\n답: (비어 있음)';
    QUESTIONS[1].reason = '외심의 성질로 이등변삼각형을 찾고 2(63°+x)=180°까지 바르게 세웠으나, 2x=54에서 계산을 멈춰 x의 값을 구하지 않음.';
    QUESTIONS[1].feedback = '식은 끝까지 바르게 세웠어요. 2x=54에서 한 걸음만 더 가서 x=27°까지 구해 답란에 적어 보세요.';
    QUESTIONS[2].correctness = 'incorrect';
    QUESTIONS[2].answer = '내접원의 반지름은 높이이므로 5×(a+b+c)=100, a+b+c=20\n답: 20cm';
    QUESTIONS[2].reason = '내접원의 반지름을 높이로 본 점은 맞으나, 삼각형 넓이 공식의 ½을 빠뜨려 5(a+b+c)=100으로 세움. 둘레를 20cm로 잘못 구함(정답 40cm).';
    QUESTIONS[2].feedback = '반지름을 높이로 본 생각은 좋아요. 삼각형 넓이는 ½×밑변×높이라서, ½을 넣어 다시 계산하면 둘레를 바르게 구할 수 있어요.';
    ELEMENTS[0].ai = 1;
    ELEMENTS[0].reason = QUESTIONS[1].reason; ELEMENTS[0].feedback = QUESTIONS[1].feedback;
    ELEMENTS[1].ai = 2;
    ELEMENTS[1].reason = QUESTIONS[2].reason; ELEMENTS[1].feedback = QUESTIONS[2].feedback;
    SUMMARY = '외심과 내접원의 성질을 떠올리고 식을 세우는 과정은 잘 따라갔어요. 계산 마무리와 넓이 공식에서 실수가 있었어요.\n\n[잘한 점]\n- 외심·내접원의 성질을 식으로 옮기는 방법을 알고 있음.\n\n[보완할 점]\n- 식을 세운 뒤 답까지 끝까지 계산하고, 넓이 공식의 ½처럼 기본 공식을 한 번 더 확인하면 좋겠음.';
  }

  var RUBRIC_FB = '외심과 내접원의 성질을 이용한 계산 문항에서 높은 점수를 받았어요.\n이등변삼각형 증명은 조건은 잘 찾았지만 결론을 맺지 않았어요. 합동 조건까지 써서 증명을 마무리해 보세요.';

  var S = { reasonView:'el', fbView:'sum', rubricMade:false, tab:'score', picked:ELEMENTS.map(function(){return null;}) }; // 처음엔 AI 제안만, 선생님이 고르거나 'AI 점수 그대로 적용'해야 확정
  try { var sv = localStorage.getItem('hiai_fb_view'); if (sv) S.fbView = sv; } catch(e){}

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function bytes(t){ return t.length + '자 / ' + new TextEncoder().encode(t).length + ' byte'; }
  function icons(){ if (window.lucide) lucide.createIcons(); }

  // 정오 판정 칩 — 정답형(definite)만. 서논술형(open)은 판정이 없어 칩 없음. 채점·피드백 탭 문항 블록 공통
  var JUDGE = { correct:['정답','judge-ok'], partially_correct:['부분 정답','judge-part'], incorrect:['오답','judge-no'] };
  function judgeChip(x){
    // 모든 문항에 태그 자리 확보: 정답형=판정, 서논술형=판정 없는 이유(유형)
    var j = (x.type === 'definite' && JUDGE[x.correctness]) ? JUDGE[x.correctness] : ['서·논술형','judge-open'];
    return '<span class="judge-chip ' + j[1] + '">' + j[0] + '</span>';
  }
  // 문항 머리: 번호 → 판정 → 문항 내용 순 (결과부터 훑게)
  function qHead(x, i){
    return '<span class="q-chip">문항 ' + (i+1) + '</span>' + judgeChip(x) + '<span class="q-title">' + esc(x.title) + '</span>';
  }

  // 관련 채점요소 (채점 탭 · 근거 문항별에서만) — 근거 아래 작은 회색 글자
  //   rel: 연결된 채점요소 index 목록(여러 개·전부 가능) / relSrc: 'ai'(AI 추론) | 'design'(평가 설계에서 선생님이 연결 — 설계 고도화 후)
  //   지금은 고칠 곳이 없으므로 툴팁 안내 없음. 설계 고도화 후 AI 추론에만 '평가 설계에서 바꿀 수 있어요' 추가 예정
  function relLine(x){
    if (!x.rel || !x.rel.length) return '';
    var names = x.rel.length === ELEMENTS.length ? '모든 채점요소' : x.rel.map(function(k){ return ELEMENTS[k].name; }).join(', ');
    // 출처를 문장 앞에 붙여 한 덩어리로 읽히게: AI 추론 → 'AI가 찾은 관련 채점요소', 선생님 연결(설계 고도화 후) → '관련 채점요소'
    return '<p class="rel-line">' + (x.relSrc === 'ai' ? 'AI가 찾은 관련 채점요소' : '관련 채점요소') + ' · ' + esc(names) + '</p>';
  }

  // ── 채점 탭 ──
  function renderScore(){
    var elMode = S.reasonView === 'el';
    var h = '';
    ELEMENTS.forEach(function(e, i){
      h += '<div style="padding:16px 0;' + (i < ELEMENTS.length-1 || !elMode ? 'border-bottom:1px solid #D9D9D9;' : '') + '">';
      h += '<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;">';
      h += '<span style="font-size:16px;font-weight:700;color:#333;">' + esc(e.name) + '</span><div style="display:flex;gap:16px;">';
      e.scores.forEach(function(s){ h += '<button class="score-btn' + (S.picked[i]===s?' selected':(S.picked[i]==null && e.ai===s?' ai':'')) + '" onclick="pickScore(' + i + ',' + s + ')">' + s + '</button>'; });
      h += '</div></div>';
      if (elMode) h += '<p class="reason">' + esc(e.reason) + '</p>';
      h += '</div>';
    });
    document.getElementById('score-rows').innerHTML = h;

    var qr = document.getElementById('q-reasons');
    if (!elMode) {
      var q = '';
      QUESTIONS.forEach(function(x, i){
        q += '<div style="padding:16px 0;' + (i < QUESTIONS.length-1 ? 'border-bottom:1px solid #EDEDED;' : '') + '">';
        q += '<div style="display:flex;align-items:flex-start;gap:8px;">' + qHead(x, i) + '</div>';
        q += '<p class="reason">' + esc(x.reason) + '</p>' + relLine(x) + '</div>';
      });
      qr.innerHTML = q; qr.style.display = 'block';
    } else { qr.style.display = 'none'; }

    // AI 제안이 남아 있을 때만(아직 확정 안 한 요소가 있을 때) 'AI 제안 점수 모두 적용' 노출
    document.getElementById('btn-applyai').style.visibility = S.picked.some(function(v){ return v == null; }) ? 'visible' : 'hidden';
    document.getElementById('rs-el').classList.toggle('active', elMode);
    document.getElementById('rs-q').classList.toggle('active', !elMode);
    var tot = S.picked.reduce(function(a,b){return a+(b||0);},0);
    var max = ELEMENTS.reduce(function(a,e){return a+Math.max.apply(null,e.scores);},0);
    document.getElementById('total').textContent = tot + ' / ' + max;
  }
  function setReasonView(v){ S.reasonView = v; renderScore(); }
  // 탭 ✓ = 저장된 값 기준 (채점: 모든 채점요소 점수 저장됨 / 피드백: 선생님 직접 피드백 저장됨). 입력만으로는 붙지 않음
  var SAVED = { score:false, fb:false };
  function renderChecks(){
    document.getElementById('score-check').classList.toggle('on', SAVED.score);
    document.getElementById('fb-check').classList.toggle('on', SAVED.fb);
  }
  function saveNow(next){
    SAVED.score = allPicked();
    SAVED.fb = document.getElementById('tfb').value.trim().length > 0;
    renderChecks();
    showToast('success', next ? '저장했어요. 다음 학생으로 이동해요.' : '저장했어요.');
  }
  function allPicked(){ return S.picked.every(function(v){ return v != null; }); }
  function nudgeFb(){ showToast('success','점수를 모두 골랐어요. 피드백은 피드백 탭에서 쓸 수 있어요.'); }
  function pickScore(i, s){ var was = allPicked(); S.picked[i] = s; renderScore(); renderRubric(); renderFb(); if (!was && allPicked()) nudgeFb(); }
  function resetScores(){ S.picked = ELEMENTS.map(function(){return null;}); S.rubricMade = false; renderScore(); renderRubric(); renderFb(); showToast('success','점수를 초기화했어요.'); }
  function applyAi(){ S.picked = ELEMENTS.map(function(e){return e.ai;}); renderScore(); renderRubric(); renderFb(); nudgeFb(); }
  function pickStatus(el){ document.querySelectorAll('.radio-circle').forEach(function(c){c.classList.remove('selected');}); el.querySelector('.radio-circle').classList.add('selected'); }

  // ── 피드백 탭: ① 과제물 분석 AI ──
  function fbText(view){
    if (view === 'q') return QUESTIONS.map(function(x,i){ return '[' + x.title + '] ' + x.feedback; }).join('\n\n');
    if (view === 'el') return ELEMENTS.map(function(e){ return '[' + e.name + '] ' + e.feedback; }).join('\n\n');
    return SUMMARY;
  }
  function renderFb(){
    renderUnitPicker();
    if (document.getElementById('with-reason')) syncWithReason();
    // 버튼 이름이 '채점 근거도 함께' 상태를 따라감 → 위 체크박스를 못 봐도 버튼에서 무엇이 들어가는지 확인
    var plus = (WITH_REASON && S.fbView !== 'sum') ? ' + 근거' : '';
    document.getElementById('fb-import-label').textContent = {sum:'종합 의견 가져오기', q:'문항별 피드백' + plus + ' 가져오기', el:'채점요소별 피드백' + plus + ' 가져오기'}[S.fbView];
    var h = '';
    var withR = WITH_REASON && S.fbView !== 'sum';
    // 근거를 켜면 '채점 근거 → 피드백' 짝으로 보여줌 (가져오기 결과와 같은 모양)
    function body(reason, fb){
      if (!withR) return '<p class="fb-text">' + esc(fb) + '</p>';
      return '<div class="pair-row"><span class="pair-label">채점 근거</span><p class="fb-text">' + esc(reason) + '</p></div>'
           + '<div class="pair-row"><span class="pair-label">피드백</span><p class="fb-text">' + esc(fb) + '</p></div>';
    }
    if (S.fbView === 'sum') {
      h = '<div class="fb-head" style="margin-bottom:12px;"><span class="q-title">종합 의견</span>' + totalTag() + '</div><p class="fb-text">' + esc(SUMMARY) + '</p>';
    } else if (S.fbView === 'q') {
      QUESTIONS.forEach(function(x,i){
        h += '<div class="fb-block"><div class="fb-head" style="align-items:flex-start;">' + qHead(x, i) + '</div>' + body(x.reason, x.feedback) + '</div>';
      });
    } else {
      ELEMENTS.forEach(function(e, i){
        h += '<div class="fb-block"><div class="fb-head"><span class="q-title">' + esc(e.name) + '</span>' + scoreTag(e.ai, S.picked[i], Math.max.apply(null, e.scores)) + '</div>' + body(e.reason, e.feedback) + '</div>';
      });
    }
    document.getElementById('fb-body').innerHTML = h;
  }
  // 피드백 옆 점수: AI 피드백은 AI 점수 기준으로 쓰였으므로, 선생님 점수가 다를 때만 둘 다 보여 눈에 띄게 (일관성 확인용)
  function scoreTag(ai, teacher, max){
    if (teacher == null) return '<span class="score-tag">AI ' + ai + ' / ' + max + '점</span>';
    if (teacher === ai) return '<span class="score-tag">' + teacher + ' / ' + max + '점</span>';
    return '<span class="score-tag diff">AI ' + ai + '점 → 선생님 ' + teacher + '점</span>';
  }
  function totalTag(){
    var max = ELEMENTS.reduce(function(a,e){ return a + Math.max.apply(null, e.scores); }, 0);
    var ai = ELEMENTS.reduce(function(a,e){ return a + e.ai; }, 0);
    var t = allPicked() ? S.picked.reduce(function(a,b){ return a + b; }, 0) : null;
    return scoreTag(ai, t, max).replace('score-tag', 'score-tag total');
  }
  // ── 문항별 제공 범위 (Beta): 학교급 무관(초·중·고 모두) 수학·과학 교과만. 그 외 교과는 비활성 + 툴팁 ──
  //    목업 확인용: ?subject=국어 → 비활성 / 기본(과학) → 활성
  var QP = new URLSearchParams(location.search);
  var SUBJECT = QP.get('subject') || '수학';
  var Q_ENABLED = SUBJECT === '수학' || SUBJECT === '과학';
  var Q_TIP = '수학, 과학 교과에서 먼저 제공하고 있어요.';
  var BETA = '<span class="beta-badge">Beta</span>';
  function applyQGate(){
    if (!Q_ENABLED) { S.reasonView = 'el'; if (S.fbView === 'q') S.fbView = 'sum'; }
    var b = document.getElementById('rs-q');
    b.innerHTML = '문항별' + BETA;
    if (!Q_ENABLED) { b.classList.add('disabled'); b.removeAttribute('onclick'); b.setAttribute('aria-disabled','true'); b.setAttribute('data-tip', Q_TIP); }
  }
  function unitCard(u){
    var isQ = u.v === 'q', off = isQ && !Q_ENABLED;
    var attrs = off ? ' aria-disabled="true" data-tip="' + Q_TIP + '"' : ' onclick="setFbView(\'' + u.v + '\')"';
    // 채점 탭 근거 전환과 같은 작은 세그먼트 (두 탭 일관)
    return '<button class="' + (u.v === S.fbView ? 'active' : '') + (off ? ' disabled' : '') + '"' + attrs + '>' + u.name + (isQ ? BETA : '') + '</button>';
  }
  // 순서: 채점 탭 근거(채점요소별 → 문항별)와 맞춤
  var UNITS = [
    { v:'sum', name:'종합 의견', icon:'file-text', desc:'글 전체를 한 번에' },
    { v:'el',  name:'채점요소별', icon:'list-checks', desc:'채점요소마다 나눠서' },
    { v:'q',   name:'문항별', icon:'list-ordered', desc:'문항마다 나눠서' }
  ];
  var FB_STYLE = (new URLSearchParams(location.search).get('fbstyle') || 'a').toLowerCase();
  function renderUnitPicker(){
    var w = document.getElementById('fb-views'), h = '';
    if (FB_STYLE === 'b') {
      h = '<div class="unit-tabs">' + UNITS.map(function(u){ return '<button class="' + (u.v===S.fbView?'active':'') + '" onclick="setFbView(\'' + u.v + '\')"><i data-lucide="' + u.icon + '" style="width:16px;height:16px;"></i>' + u.name + '</button>'; }).join('') + '</div>';
      w.style.borderBottom = 'none'; w.style.paddingBottom = '0';
    } else if (FB_STYLE === 'c') {
      h = '<div class="unit-fill">' + UNITS.map(function(u){ return '<button class="' + (u.v===S.fbView?'active':'') + '" onclick="setFbView(\'' + u.v + '\')"><i data-lucide="' + u.icon + '" style="width:16px;height:16px;"></i>' + u.name + '</button>'; }).join('') + '</div>';
    } else {
      // 채점 탭 '근거 [세그먼트]'와 같은 모양: 라벨 + 세그먼트
      // 채점 근거도 함께: 단위 선택 옆 — 켜면 화면에도 근거가 같이 보이고, 보이는 그대로 가져온다 (종합 의견은 근거 없음 → 숨김)
      h = '<div style="display:flex;align-items:center;gap:10px;"><span class="seg-label">피드백</span><div class="seg">' + UNITS.map(unitCard).join('') + '</div>'
        + '<label id="with-reason-wrap" style="margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#333;cursor:pointer;user-select:none;">'
        + '<input type="checkbox" id="with-reason" onchange="setWithReason(this.checked)" style="width:16px;height:16px;accent-color:#0950A0;cursor:pointer;margin:0;">채점 근거도 함께</label></div>';
    }
    w.innerHTML = h; icons();
  }
  function setFbView(v){ S.fbView = v; try{ localStorage.setItem('hiai_fb_view', v); }catch(e){} renderFb(); }
  // 채점 근거도 함께 — 기본 켬(기존 가져오기가 근거까지 가져왔음), 마지막 선택 기억
  var WITH_REASON = true;
  try { var wr = localStorage.getItem('hiai_fb_with_reason'); if (wr != null) WITH_REASON = (wr === '1'); } catch(e){}
  function setWithReason(v){ WITH_REASON = v; try{ localStorage.setItem('hiai_fb_with_reason', v ? '1' : '0'); }catch(e){} renderFb(); }
  function syncWithReason(){
    document.getElementById('with-reason-wrap').style.display = S.fbView === 'sum' ? 'none' : 'inline-flex';
    document.getElementById('with-reason').checked = WITH_REASON;
  }
  function importFb(){
    if (S.fbView === 'sum' || !WITH_REASON) { importText(fbText(S.fbView)); return; }
    var items = S.fbView === 'q'
      ? QUESTIONS.map(function(x,i){ return { head:x.title, reason:x.reason, fb:x.feedback }; })
      : ELEMENTS.map(function(e){ return { head:e.name, reason:e.reason, fb:e.feedback }; });
    importText(items.map(function(it){ return '[' + it.head + ']\n채점 근거: ' + it.reason + '\n피드백: ' + it.fb; }).join('\n\n'));
  }

  // ── 피드백 탭: ② 루브릭 기반 AI (보기 옵션 없음) ──
  function renderRubric(){
    var all = S.picked.every(function(v){ return v != null; });
    var h;
    if (S.rubricMade && all) {
      h = '<p class="fb-text">' + esc(RUBRIC_FB) + '</p>'
        + '<div style="display:flex;align-items:center;justify-content:flex-end;margin-top:20px;">'
        + '<button class="pill-btn" style="height:36px;" onclick="importText(RUBRIC_FB)"><i data-lucide="download" style="width:14px;height:14px;"></i>피드백 가져오기</button></div>';
    } else if (all) {
      h = '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;"><span style="font-size:16px;color:#494949;line-height:1.5;">고른 점수로 피드백을 만들 수 있어요.</span>'
        + '<button class="pill-btn" style="height:36px;flex-shrink:0;" onclick="makeRubric()"><i data-lucide="sparkles" style="width:14px;height:14px;"></i>피드백 만들기</button></div>';
    } else {
      h = '<p style="font-size:16px;color:#808080;line-height:1.5;margin:0;">모든 채점요소 점수를 고르면 피드백을 만들 수 있어요.</p>';
    }
    document.getElementById('rb-body').innerHTML = h;
    icons();
  }
  function makeRubric(){ S.rubricMade = true; renderRubric(); showToast('success','루브릭 기반 AI 피드백을 만들었어요.'); }

  // ── 가져오기 (읽기 전용 AI 피드백 → 선생님 직접 피드백) ──
  function importText(add){
    var ta = document.getElementById('tfb');
    var had = ta.value.trim().length > 0;
    ta.value = had ? ta.value.replace(/\s+$/, '') + '\n\n' + add : add;
    onTfb();
    ta.scrollIntoView({behavior:'smooth', block:'center'});
    showToast('success', had ? 'AI 피드백을 기존 내용 아래에 붙였어요.' : 'AI 피드백을 가져왔어요.');
  }
  function onTfb(){
    var v = document.getElementById('tfb').value;
    document.getElementById('tfb-count').textContent = bytes(v);
  }

  // ── 탭 (#score / #feedback) ──
  function switchTab(t){
    S.tab = t;
    document.getElementById('r-tab-score').classList.toggle('active', t==='score');
    document.getElementById('r-tab-fb').classList.toggle('active', t==='fb');
    document.getElementById('pane-score').style.display = t==='score' ? 'block' : 'none';
    document.getElementById('pane-fb').style.display = t==='fb' ? 'block' : 'none';
    document.getElementById('r-scroll').scrollTop = 0;
    history.replaceState(null, '', t==='fb' ? '#feedback' : '#score');
  }

  // ── 좌측 ──
  function switchLeft(t){
    document.getElementById('l-tab-orig').classList.toggle('active', t==='orig');
    document.getElementById('l-tab-text').classList.toggle('active', t==='text');
    document.getElementById('l-orig').style.display = t==='orig' ? 'flex' : 'none';
    document.getElementById('l-text').style.display = t==='text' ? 'block' : 'none';
  }
  function renderLeftText(){
    var h = '';
    QUESTIONS.forEach(function(x,i){
      h += '<div><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;"><span class="q-chip">문항 ' + (i+1) + '</span><span style="font-size:14px;font-weight:700;color:#808080;">' + esc(x.title) + '</span></div><p style="font-size:16px;color:#333;line-height:1.85;margin:0;white-space:pre-wrap;">' + esc(x.answer) + '</p></div>';
    });
    document.getElementById('l-text-body').innerHTML = h;
  }

  // ── 토스트 ──
  var toastTimer;
  function showToast(type, msg){
    var t = document.getElementById('toast');
    clearTimeout(toastTimer);
    t.style.background = type === 'success' ? '#00AF3D' : '#0950A0';
    t.innerHTML = '<i data-lucide="' + (type==='success'?'circle-check-big':'info') + '" style="width:20px;height:20px;flex-shrink:0;"></i><span>' + esc(msg) + '</span>';
    t.style.display = 'flex'; icons();
    toastTimer = setTimeout(function(){ t.style.display = 'none'; }, 2200);
  }

  applyQGate();
  if (CASE_KEY === 'mixed') {
    // 가상 답안이라 원본 이미지와 내용이 다름 → 이름에 표시하고 왼쪽은 인식 결과(가상 답안 텍스트)로 연다
    document.getElementById('student-name').textContent = '10101 김하나 (판정 예시 · 가상 답안)';
    RUBRIC_FB = '식을 세우는 과정은 잘 따라갔지만 계산 마무리와 넓이 공식에서 실수가 있었어요.\n답까지 끝까지 계산하고, 기본 공식을 한 번 더 확인해 보세요.';
  }
  renderScore(); renderFb(); renderRubric(); renderLeftText(); onTfb();
  if (CASE_KEY === 'mixed') switchLeft('text');
  switchTab(location.hash === '#feedback' ? 'fb' : 'score');
  icons();
</script>

    <button class="mp-btn" data-f="scoring_student_v5.html" onclick="mpNav(this.dataset.f)">시안 2 <span class="mp-sub">근거·피드백 한 섹션</span></button>
    <button class="mp-btn" data-f="scoring_student_v6.html" onclick="mpNav(this.dataset.f)">시안 3 <span class="mp-sub">근거·피드백 섹션 분리</span></button>

    <button class="mp-btn" data-case="mixed" onclick="location.href='scoring_student_v4.html?case=mixed#score'">판정 예시 <span class="mp-sub">부분 정답 · 오답 (가상 답안)</span></button>

<script>
  (function(){
    var cur = location.pathname.split('/').pop();
    var curCase = new URLSearchParams(location.search).get('case') || 'real';
    document.querySelectorAll('#mockpick .mp-btn').forEach(function(b){ b.classList.toggle('on', b.dataset.case ? b.dataset.case === curCase : (b.dataset.f === cur && !b.dataset.case && false)); });
    document.querySelector('#mockpick .mp-btn[data-f="' + cur + '"]') && document.querySelector('#mockpick .mp-btn[data-f="' + cur + '"]').classList.add('on');
    window.mpNav = function(f){ if (f !== cur) location.href = f; };
    var el = document.getElementById('mockpick'), body = document.getElementById('mp-body'), caret = document.getElementById('mp-caret');
    var KEY = 'hiai_mp_scoring_student';
    try { var st = JSON.parse(sessionStorage.getItem(KEY) || '{}');
      if (st.left != null) { el.style.left = st.left + 'px'; el.style.top = st.top + 'px'; el.style.bottom = 'auto'; }
      if (st.closed) { body.style.display = 'none'; caret.style.transform = 'rotate(180deg)'; }
    } catch(e){}
    function save(){ try { var r = el.getBoundingClientRect(); sessionStorage.setItem(KEY, JSON.stringify({ left:r.left, top:r.top, closed: body.style.display === 'none' })); } catch(e){} }
    var sx, sy, ox, oy, drag = false, moved = false;
    el.addEventListener('mousedown', function(e){ if (e.target.closest('.mp-btn')) return; drag = true; moved = false; var r = el.getBoundingClientRect(); sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top; });
    window.addEventListener('mousemove', function(e){ if (!drag) return; var dx = e.clientX - sx, dy = e.clientY - sy; if (Math.abs(dx) + Math.abs(dy) > 3) moved = true; if (!moved) return;
      el.style.left = Math.max(0, Math.min(window.innerWidth - el.offsetWidth, ox + dx)) + 'px'; el.style.top = Math.max(0, Math.min(window.innerHeight - el.offsetHeight, oy + dy)) + 'px'; el.style.bottom = 'auto'; });
    window.addEventListener('mouseup', function(){ if (drag && moved) save(); drag = false; });
    document.getElementById('mp-head').addEventListener('click', function(){ if (moved) { moved = false; return; } var open = body.style.display !== 'none'; body.style.display = open ? 'none' : 'flex'; caret.style.transform = open ? 'rotate(180deg)' : ''; save(); });
    if (window.lucide) lucide.createIcons();
  })();
</script>
</body>
</html>
