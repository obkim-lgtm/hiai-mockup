<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIAI 목업 URL 인덱스</title>
<link rel="icon" href="../screens/favicon_src.png" type="image/png">
<link rel="stylesheet" href="https://cdn.rawgit.com/moonspam/NanumSquareRound/master/nanumsquareround.min.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --primary:#7E44FB; --primary-50:#F7F4FF; --primary-100:#EFE8FF;
    --text:#000; --muted:#494949; --subtle:#808080;
    --border:#D9D9D9; --border-soft:#ECECEC;
    --bg:#F5F4F9; --card:#fff;
    --green:#00AF3D; --orange:#FF8C4C; --blue:#5890FF; --red:#DB3E51;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'NanumSquareRound',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px 80px;}

  /* 헤더 */
  header{
    background:linear-gradient(120deg,#7E44FB 0%,#9B6BFF 100%);
    color:#fff; padding:36px 0 30px; margin-bottom:28px;
  }
  header .wrap{padding-bottom:0;}
  .h-top{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .h-badge{
    display:inline-flex; align-items:center; justify-content:center; line-height:1;
    background:rgba(255,255,255,0.18); border-radius:8px; padding:6px 12px;
    font-size:13px; font-weight:700; letter-spacing:0.02em;
  }
  header h1{margin:0; font-size:28px; font-weight:800; letter-spacing:-0.01em;}
  header p{margin:8px 0 0; font-size:15px; font-weight:400; color:rgba(255,255,255,0.88); line-height:1.6;}

  /* 검색 */
  .search-row{display:flex; align-items:center; gap:12px; margin-bottom:22px; flex-wrap:wrap;}
  .search{
    flex:1; min-width:240px; position:relative; display:flex; align-items:center;
    background:#fff; border:1px solid var(--border); border-radius:12px; padding:0 14px; height:48px;
    box-shadow:0 2px 10px rgba(95,102,178,0.06);
  }
  .search i{width:20px; height:20px; color:var(--subtle); flex-shrink:0;}
  .search input{
    border:none; outline:none; flex:1; height:100%; margin-left:10px;
    font-family:inherit; font-size:16px; color:var(--text); background:transparent;
  }
  .search input::placeholder{color:#B3B3B3;}
  .count{font-size:14px; color:var(--subtle); font-weight:700; white-space:nowrap;}

  /* 안내 배너 (좌측 컬러띠 없이 배경+아이콘만) */
  .info{
    display:flex; align-items:flex-start; gap:10px;
    background:var(--primary-50); border-radius:12px; padding:14px 16px; margin-bottom:26px;
  }
  .info i{width:20px; height:20px; color:var(--primary); flex-shrink:0; margin-top:1px;}
  .info span{font-size:14px; color:var(--muted); line-height:1.6;}

  /* 섹션 */
  .section{margin-bottom:34px;}
  .sec-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .sec-head .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .sec-head h2{margin:0; font-size:20px; font-weight:800; color:#341761;}
  .sec-note{
    display:inline-flex; align-items:center; justify-content:center; line-height:1;
    font-size:13px; font-weight:700; color:var(--primary);
    background:var(--primary-100); border-radius:100px; padding:4px 11px;
  }

  /* 카드 */
  .card{
    background:var(--card); border:1px solid var(--border-soft); border-radius:16px;
    padding:20px 22px; margin-bottom:14px;
    box-shadow:0 4px 20px rgba(95,102,178,0.06);
  }
  .card-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:4px;}
  .card-title{display:flex; align-items:center; gap:10px;}
  .card-title h3{margin:0; font-size:18px; font-weight:800; color:var(--text);}
  .file-open{
    display:inline-flex; align-items:center; justify-content:center; line-height:1; gap:5px;
    font-size:13px; font-weight:700; color:var(--primary); padding:5px 10px; border-radius:7px;
    border:1px solid var(--primary-100); background:var(--primary-50);
  }
  .file-open:hover{background:var(--primary-100);}
  .file-open i{width:13px; height:13px;}
  .card-file{font-size:12px; color:#B3B3B3; font-weight:700;}
  .card-desc{font-size:14px; color:var(--muted); line-height:1.6; margin:6px 0 14px;}

  /* 상태 링크 칩 */
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    display:inline-flex; align-items:center; justify-content:center; line-height:1; gap:6px;
    height:34px; padding:0 13px; border-radius:8px; border:1px solid var(--border);
    background:#fff; color:var(--muted); font-size:14px; font-weight:700; cursor:pointer;
    transition:all .12s ease;
  }
  .chip:hover{border-color:var(--primary); color:var(--primary); background:var(--primary-50);}
  .chip.default{border-color:var(--primary); color:var(--primary); background:var(--primary-50);}
  .chip .tag{font-size:11px; font-weight:700; color:#fff; padding:1px 6px; border-radius:100px; margin-left:2px;}
  .chip i.ext{width:12px; height:12px; opacity:.55;}

  .pattern{
    display:inline-flex; align-items:center; gap:7px; margin-top:11px;
    font-size:12.5px; color:var(--subtle); background:#F8F8F8; border-radius:6px; padding:5px 9px;
    font-family:'SFMono-Regular',Consolas,monospace; font-weight:400;
  }

  .sub-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:1px dashed var(--border-soft);}
  .sub-label{font-size:14px; font-weight:700; color:var(--subtle); white-space:nowrap;}

  .empty-note{display:none; text-align:center; padding:48px 0; color:var(--subtle); font-size:15px;}

  footer{margin-top:20px; text-align:center; color:#B3B3B3; font-size:12.5px; line-height:1.7;}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="h-top">
      <span class="h-badge">HIAI · 하이러닝 AI</span>
      <span class="h-badge">목업 인덱스</span>
    </div>
    <h1>서·논술형 평가 서비스 — 화면 URL 인덱스</h1>
    <p>모든 목업 화면과 상태별 딥링크 모음. 각 링크는 새 탭에서 열립니다.</p>
  </div>
</header>

<div class="wrap">

  <div class="info">
    <i data-lucide="info"></i>
    <span>링크는 모두 <b>새 탭</b>으로 열려 <code>#해시</code> 딥링크도 항상 정상 로드됩니다. 상태가 여러 개인 화면은 칩으로 구분했고, 학생처럼 목록이 긴 경우 대표 예시 + 패턴을 표기했습니다.</span>
  </div>

  <div id="board"></div>

  <footer>
    HIAI 목업 인덱스 · 로컬 미리보기 <code>http://localhost:3503/output/</code><br>
    파일을 직접 열려면 각 카드의 파일명 버튼을 누르세요.
  </footer>
</div>

<script>

        states:[

        ]}},
      { name:'AI 채점', file:'task_ocr_review_v1.html', desc:'AI 채점 실행 전 과제물 인식 여부 확인, OCR 인식 결과 확인이 필요한 학생의 과제물이 확인되지 않은 경우 재안내<br><b>학생 채점 상세 화면에서 OCR 인식 결과 표시</b> (단, 과제물 인식 결과 수정은 과제물 관리에서 진행, 채점 화면에서 제공하지 않음)',

          {label:'10104 최유진', hash:'#student=3'},
          {label:'10108 한지우', hash:'#student=7'},
          {label:'10131 김하이', hash:'#student=31'},
        ],
        pattern:'전체: #student=<0~31> (0-based 순번)'},
      { name:'채점 근거 하이라이팅', file:'scoring_highlight_v1.html', desc:'답안 원문에 채점 근거 하이라이트 + AI 분석 패널.',
        states:[
          {label:'AI: 과제물 분석', hash:'#ai=analysis', def:true},
          {label:'AI: 루브릭 기반', hash:'#ai=rubric'},
          {label:'뷰어: 인식 결과', hash:'#view=text'},

    ]
  },
  {

    cards:[
      { name:'학생 채점 상세 (현행 v3)', file:'scoring_student_v3.html', desc:'문항별 근거·피드백 · 루브릭 점수. ?id=&name= 로 학생 딥링크, eval 컨텍스트 보존.',
        states:[
          {label:'김초등 (기본)', query:'?id=40205&name=김초등', def:true},
          {label:'재채점 배너', query:'?eval=C&id=10103&name=박지민', tag:'#FF8C4C'},
        ],

        states:[ {label:'열기', query:'', def:true} ],
        pattern:'다른 학생: ?id=<id>&name=<이름>'},
      { name:'김문항 케이스', file:'scoring_student_kimmh_v1.html', desc:'고정 케이스(김문항) + 드롭다운 이동.',

        pattern:'다른 학생: ?id=<id>&name=<이름>'},
      { name:'유초등 케이스별', file:'scoring_student_elementary_v1.html', desc:'유초등 리스킨 — 상태별(확인필요·미제출·채점전·실패·이전채점·히스토리) 딥링크.',
        states:[
          {label:'확인 필요', query:'?id=40201&name=초등학생', def:true},
          {label:'미제출', query:'?id=40202&name=미제출'},
          {label:'채점 전', query:'?id=40203&name=채점전'},

// ── 렌더 ──
const board = document.getElementById('board');
let TOTAL = 0;

SECTIONS.forEach(sec=>{
  const secEl = document.createElement('div');
  secEl.className='section';
  secEl.dataset.sec = sec.title;

  const head = document.createElement('div');
  head.className='sec-head';
  head.innerHTML = '<span class="dot" style="background:'+sec.color+'"></span><h2>'+sec.title+'</h2>'+
    (sec.note ? '<span class="sec-note">'+sec.note+'</span>' : '');
  secEl.appendChild(head);

  sec.cards.forEach(card=>{
    const cardEl = document.createElement('div');
    cardEl.className='card';
    const chip = s=>{
      const f = s.file || card.file;
      const href = f + (s.query||'') + (s.hash||'');
      const tag = s.tag ? '<span class="tag" style="background:'+s.tag+'">!</span>' : '';
      const tip = s.tip ? ' title="'+s.tip+'"' : '';
      return '<a class="chip'+(s.def?' default':'')+'" href="'+href+'"'+tip+' target="_blank" rel="noopener">'+
        s.label+tag+'<i class="ext" data-lucide="arrow-up-right"></i></a>';
    };
    let chipsHtml = card.states.map(chip).join('');

    const subList = card.subs || (card.sub ? [card.sub] : []);
    const subHtml = subList.map(sub=>
      '<div class="sub-row"><span class="sub-label">'+sub.label+'</span><div class="chips">'+sub.states.map(chip).join('')+'</div></div>'
    ).join('');

    cardEl.innerHTML =
      '<div class="card-head">'+
        '<div class="card-title"><h3>'+card.name+'</h3></div>'+
      '</div>'+
      '<div class="card-desc">'+card.desc+'</div>'+
      '<div class="chips">'+chipsHtml+'</div>'+
      subHtml;

    TOTAL += card.states.length + subList.reduce((n,s)=>n+s.states.length, 0);
    secEl.appendChild(cardEl);
  });

  board.appendChild(secEl);
});

lucide.createIcons();
</script>
</body>
</html>
