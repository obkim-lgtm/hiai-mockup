<svg viewBox="0 0 600 760" xmlns="http://www.w3.org/2000/svg">
  <style>
    .q   { font-family:'Times New Roman', serif; font-size:21px; fill:#111; }
    .qn  { font-family:'NanumSquareRound','Malgun Gothic',sans-serif; font-size:20px; fill:#111; }
    .hw  { font-family:'Comic Sans MS','Segoe Script',cursive; fill:#33342f; }
    .hwb { font-family:'Comic Sans MS','Segoe Script',cursive; fill:#1b3a8a; }
    .axis{ stroke:#222; stroke-width:1.6; }
    .curve{ fill:none; stroke:#3a3a3a; stroke-width:2.2; }
  </style>

  <rect width="600" height="760" fill="#ffffff"/>

  <!-- 표 외곽/구분선 -->
  <line x1="22" y1="22"  x2="578" y2="22"  stroke="#222" stroke-width="1.6"/>
  <line x1="22" y1="74"  x2="578" y2="74"  stroke="#222" stroke-width="1"/>
  <line x1="22" y1="388" x2="578" y2="388" stroke="#222" stroke-width="1.6"/>
  <line x1="22" y1="440" x2="578" y2="440" stroke="#222" stroke-width="1"/>
  <line x1="22" y1="744" x2="578" y2="744" stroke="#222" stroke-width="1.6"/>
  <line x1="22" y1="22"  x2="22"  y2="744" stroke="#222" stroke-width="1.6"/>
  <line x1="578" y1="22" x2="578" y2="744" stroke="#222" stroke-width="1.6"/>

  <!-- (3) 문제 -->
  <text x="36" y="54" class="q">(3) <tspan font-style="italic">y</tspan> = − <tspan font-style="italic">x</tspan>² + 2<tspan font-style="italic">x</tspan> + 2 의 그래프의 개형을 그리시오.</text>
  <text x="64" y="48" class="q" font-size="14">1</text>
  <line x1="62" y1="52" x2="78" y2="52" stroke="#111" stroke-width="1"/>
  <text x="64" y="66" class="q" font-size="14">3</text>

  <!-- 좌측 작은 메모 (1/3 x 9, 9) -->
  <text x="46" y="170" class="hw" font-size="22" transform="rotate(-6 46 170)">1</text>
  <line x1="42" y1="178" x2="64" y2="178" stroke="#33342f" stroke-width="1.4"/>
  <text x="46" y="198" class="hw" font-size="22">3</text>
  <text x="74" y="186" class="hw" font-size="22">×9</text>
  <circle cx="58" cy="232" r="16" fill="none" stroke="#33342f" stroke-width="1.6"/>
  <text x="50" y="240" class="hw" font-size="22">9</text>

  <!-- 중앙 그래프 (빨간 박스) -->
  <g>
    <!-- 좌표축 -->
    <line x1="300" y1="92"  x2="300" y2="362" class="axis"/>
    <line x1="196" y1="232" x2="430" y2="232" class="axis"/>
    <!-- 위로 볼록 포물선 (학생이 그린 형태) -->
    <path class="curve" d="M 250 360 Q 320 96 392 360"/>
    <!-- 꼭짓점/보조선 (학생 표기) -->
    <line x1="300" y1="232" x2="270" y2="330" stroke="#3a3a3a" stroke-width="1.6"/>
    <line x1="270" y1="330" x2="300" y2="330" stroke="#3a3a3a" stroke-width="1.4" stroke-dasharray="3 3"/>
    <!-- 표기 숫자 (손글씨) -->
    <text x="306" y="150" class="hw" font-size="20">2</text>
    <text x="250" y="248" class="hw" font-size="18">−</text>
    <text x="262" y="244" class="hw" font-size="14">1</text>
    <line x1="260" y1="248" x2="272" y2="248" stroke="#33342f" stroke-width="1.2"/>
    <text x="262" y="262" class="hw" font-size="14">3</text>
    <text x="318" y="346" class="hw" font-size="20">−9</text>
    <!-- 빨간 강조 박스 -->
    <rect x="206" y="96" width="196" height="262" fill="none" stroke="#e53935" stroke-width="3"/>
  </g>

  <!-- 우측 작은 삼각형 메모 -->
  <path d="M 498 150 L 512 250 L 470 250 Z" fill="none" stroke="#33342f" stroke-width="1.6"/>
  <text x="500" y="140" class="hw" font-size="20">1</text>
  <line x1="496" y1="146" x2="512" y2="146" stroke="#33342f" stroke-width="1.2"/>
  <text x="500" y="160" class="hw" font-size="20" opacity="0">3</text>
  <text x="486" y="200" class="hw" font-size="18">1/3</text>

  <!-- (4) 문제 -->
  <text x="36" y="420" class="q">(4) △<tspan font-style="italic">ABO</tspan> 의 넓이를 구하시오.</text>

  <!-- (4) 손풀이 -->
  <g class="hw" font-size="26">
    <text x="60"  y="500">9 ×</text>
    <text x="118" y="492" font-size="18">1</text>
    <line x1="116" y1="497" x2="134" y2="497" stroke="#33342f" stroke-width="1.4"/>
    <text x="118" y="512" font-size="18">3</text>
    <text x="142" y="500">×</text>
    <text x="170" y="492" font-size="18">1</text>
    <line x1="168" y1="497" x2="186" y2="497" stroke="#33342f" stroke-width="1.4"/>
    <text x="172" y="512" font-size="18">2</text>
    <text x="196" y="500">=</text>
    <text x="232" y="492" font-size="18">3</text>
    <line x1="228" y1="497" x2="248" y2="497" stroke="#33342f" stroke-width="1.4"/>
    <text x="232" y="512" font-size="18">2</text>
    <ellipse cx="238" cy="500" rx="20" ry="18" fill="none" stroke="#33342f" stroke-width="1.4"/>

    <text x="300" y="500">,</text>
    <ellipse cx="360" cy="500" rx="46" ry="20" fill="none" stroke="#33342f" stroke-width="1.4"/>
    <text x="324" y="492" font-size="18">1</text>
    <line x1="322" y1="497" x2="340" y2="497" stroke="#33342f" stroke-width="1.4"/>
    <text x="326" y="512" font-size="18">3</text>
    <text x="346" y="500">× 2 ×</text>
    <text x="404" y="492" font-size="18">1</text>
    <line x1="402" y1="497" x2="420" y2="497" stroke="#33342f" stroke-width="1.4"/>
    <text x="406" y="512" font-size="18">2</text>
  </g>

  <g class="hw" font-size="26">
    <text x="120" y="610">3</text>
    <line x1="116" y1="618" x2="136" y2="618" stroke="#33342f" stroke-width="1.6"/>
    <text x="120" y="640">2</text>
    <text x="146" y="624">+</text>
    <text x="178" y="610">1</text>
    <line x1="174" y1="618" x2="194" y2="618" stroke="#33342f" stroke-width="1.6"/>
    <text x="178" y="640">3</text>
    <text x="208" y="624">=</text>
    <text x="246" y="610">9</text>
    <line x1="242" y1="618" x2="262" y2="618" stroke="#33342f" stroke-width="1.6"/>
    <text x="246" y="640">6</text>
    <text x="274" y="624">+</text>
    <text x="306" y="610">2</text>
    <line x1="302" y1="618" x2="322" y2="618" stroke="#33342f" stroke-width="1.6"/>
    <text x="306" y="640">6</text>
    <text x="336" y="624">=</text>
    <!-- 최종답 동그라미 -->
    <ellipse cx="402" cy="624" rx="40" ry="34" fill="none" stroke="#33342f" stroke-width="1.8"/>
    <text x="392" y="614">11</text>
    <line x1="386" y1="624" x2="418" y2="624" stroke="#33342f" stroke-width="1.8"/>
    <text x="396" y="648">6</text>
    <text x="426" y="650" font-size="16">cm²</text>
  </g>
</svg>
